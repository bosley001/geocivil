# Blueprint Render : New > Blueprint > sélectionner ce dépôt.
# Vérifier les noms de plans dans le tableau de bord Render (ils évoluent).
databases:
  - name: geocivil-db-v2
    databaseName: geocivil_v2
    user: geocivil_v2
    plan: basic-256mb
services:
  - type: web
    name: geocivil-api-v2
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: geocivil-db-v2, property: connectionString}
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGINS
        value: https://geocivil-frontend-v2.onrender.com
  - type: web
    name: geocivil-frontend-v2
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://geocivil-api-v2.onrender.com
